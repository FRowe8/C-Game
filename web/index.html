<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Quantum Idle - A quantum mechanics inspired idle game">
    <meta name="theme-color" content="#1a1a2e">
    <title>Quantum Idle - A Quantum Mechanics Idle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(0, 0, 0, 0.35);
            text-align: center;
            padding: 12px;
            border-bottom: 1px solid rgba(94, 243, 255, 0.35);
        }

        header h1 {
            font-size: clamp(1.2rem, 4vw, 2rem);
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #5ef3ff, #a855f7, #5ef3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 100%;
            animation: shimmer 4s infinite linear;
        }

        header p {
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            color: #a8c7ff;
            opacity: 0.85;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 0;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            height: 100%;
            max-height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            border: 2px solid rgba(94, 243, 255, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
            overflow: hidden;
        }

        canvas.emscripten {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin: 0 auto;
        }

        #loading {
            position: absolute;
            inset: 0;
            background: rgba(16, 18, 34, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.35s ease;
            z-index: 10;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(94, 243, 255, 0.15);
            border-top-color: #5ef3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 1rem;
            color: #5ef3ff;
            text-align: center;
        }

        #progress-bar {
            width: 80%;
            max-width: 360px;
            height: 6px;
            background: rgba(94, 243, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5ef3ff, #a855f7);
            transition: width 0.25s ease;
        }

        #output {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Quantum Idle</h1>
        <p>Quantum mechanics meets incremental gameplay.</p>
    </header>

    <main>
        <div id="canvas-container">
            <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex="-1" aria-label="Quantum Idle game canvas"></canvas>
            <div id="loading">
                <div class="loader" aria-hidden="true"></div>
                <div id="loading-text" role="status">Initializing...</div>
                <div id="progress-bar" aria-hidden="true">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="output"></div>

    <script type="text/javascript">
        (function() {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loading-text');
            const progressFill = document.getElementById('progress-fill');
            const canvasContainer = document.getElementById('canvas-container');
            const canvas = document.getElementById('canvas');

            function resizeCanvas() {
                const rect = canvasContainer.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }

            window.addEventListener('resize', resizeCanvas);

            window.Module = {
                preRun: [],
                postRun: [],
                print: function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log('[WASM]', text);
                },
                printErr: function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.error('[WASM]', text);
                },
                canvas: (function() {
                    canvas.addEventListener('webglcontextlost', function(e) {
                        alert('WebGL context lost. Please reload the page.');
                        e.preventDefault();
                    }, false);
                    return canvas;
                })(),
                webglContextAttributes: {
                    alpha: false,
                    antialias: false,
                    depth: true,
                    stencil: false,
                    preserveDrawingBuffer: false,
                    powerPreference: 'high-performance'
                },
                setStatus: function(text) {
                    if (!text) {
                        loading.classList.add('hidden');
                        return;
                    }

                    loading.classList.remove('hidden');
                    loadingText.textContent = text;

                    const match = text.match(/(\d+)%/);
                    if (match) {
                        const pct = parseInt(match[1]);
                        progressFill.style.width = pct + '%';
                    }
                },
                monitorRunDependencies: function(left) {
                    if (left === 0) {
                        loading.classList.add('hidden');
                    }
                }
            };

            resizeCanvas();
        })();
    </script>

    <!-- Emscripten script placeholder (required by Emscripten) -->
    {{{ SCRIPT }}}
</body>
</html>
