<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Quantum Idle - A quantum mechanics inspired idle game">
    <meta name="theme-color" content="#1a1a2e">
    <title>Quantum Idle - A Quantum Mechanics Idle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --safe-top: max(env(safe-area-inset-top, 0px), 12px);
            --safe-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
            --safe-left: max(env(safe-area-inset-left, 0px), 12px);
            --safe-right: max(env(safe-area-inset-right, 0px), 12px);
            --panel-glow: 0 10px 40px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        /* Header */
        #header {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(94, 243, 255, 0.3);
            flex-shrink: 0;
        }

        #header h1 {
            font-size: clamp(1.2rem, 4vw, 2rem);
            background: linear-gradient(90deg, #5ef3ff, #a855f7, #5ef3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s infinite linear;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #header p {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: #5ef3ff;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Main Game Container */
        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            min-height: 0;
            gap: 12px;
        }

        /* Canvas Container */
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            height: 100%;
            max-height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border: 2px solid rgba(94, 243, 255, 0.2);
            box-shadow: var(--panel-glow);
            overflow: hidden;
        }

        /* Responsive canvas */
        canvas.emscripten {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin: 0 auto;
        }

        /* Loading Screen */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(94, 243, 255, 0.1);
            border-top-color: #5ef3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            margin-top: 20px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: #5ef3ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #progress-bar {
            width: 80%;
            max-width: 400px;
            height: 6px;
            background: rgba(94, 243, 255, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5ef3ff, #a855f7);
            width: 0%;
            transition: width 0.3s;
            border-radius: 3px;
        }

        /* Footer Controls */
        #controls {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(94, 243, 255, 0.3);
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #mobile-enhancements {
            width: 100%;
            max-width: 1280px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid rgba(94, 243, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            box-shadow: var(--panel-glow);
        }

        .glass-card h3 {
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: #5ef3ff;
            margin-bottom: 8px;
        }

        .touch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
        }

        .touch-btn {
            background: linear-gradient(135deg, rgba(94, 243, 255, 0.2), rgba(168, 85, 247, 0.3));
            border: 1px solid rgba(94, 243, 255, 0.4);
            color: #fff;
            border-radius: 12px;
            padding: 14px 12px;
            text-align: left;
            display: flex;
            gap: 10px;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: var(--touch-shadow, none);
        }

        .touch-btn:active {
            transform: scale(0.98);
            box-shadow: 0 6px 20px rgba(94, 243, 255, 0.35);
        }

        .touch-btn span {
            display: block;
            font-size: 0.85rem;
            opacity: 0.85;
        }

        .drag-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 6px;
            cursor: grab;
        }

        .chip {
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(94, 243, 255, 0.25);
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .tab-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .tab {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(94, 243, 255, 0.35);
            background: rgba(94, 243, 255, 0.08);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #5ef3ff, #a855f7);
            color: #0f1022;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.35);
        }

        .tab-panel {
            display: none;
            gap: 8px;
            flex-direction: column;
        }

        .tab-panel.active {
            display: flex;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .toggle {
            position: relative;
            width: 46px;
            height: 26px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(94, 243, 255, 0.45);
            cursor: pointer;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            top: 3px;
            left: 4px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s ease;
        }

        .toggle.active::after {
            transform: translateX(18px);
            background: #0f1022;
        }

        .toggle.active {
            background: linear-gradient(135deg, #5ef3ff, #a855f7);
        }

        body.input-paused #mobile-enhancements {
            opacity: 0.5;
            filter: grayscale(0.2);
        }

        body.reduced-motion *,
        body.reduced-motion *::before,
        body.reduced-motion *::after {
            animation-duration: 0s !important;
            transition-duration: 0s !important;
        }

        .btn {
            background: linear-gradient(135deg, #5ef3ff, #a855f7);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(94, 243, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            #header {
                padding: 8px 15px;
            }

            #game-container {
                padding: 5px;
            }

            #controls {
                padding: 8px 10px;
                gap: 5px;
            }

            .btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            .touch-btn {
                padding: 12px 10px;
            }
        }

        /* Portrait Mode Warning */
        @media (orientation: portrait) and (max-width: 768px) {
            #canvas-container::before {
                content: "📱 Rotate for better experience";
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 0.8rem;
                z-index: 10;
                animation: fadeIn 0.5s;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Output/Console */
        #output {
            display: none; /* Hide by default */
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>⚛️ Quantum Idle</h1>
        <p>Harness the power of quantum mechanics</p>
    </div>

    <div id="game-container">
        <div id="canvas-container">
            <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

            <div id="loading">
                <div class="loader"></div>
                <div id="loading-text">Initializing Quantum State...</div>
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>

    <div id="controls">
        <button class="btn" onclick="toggleFullscreen()">🖥️ Fullscreen</button>
        <button class="btn" onclick="resetGame()">🔄 New Game</button>
        <button class="btn" onclick="showHelp()">❓ Help</button>
    </div>

    <div id="output"></div>

    <script type='text/javascript'>
        console.log("=== HTML SCRIPT LOADED ===");

        // Progress tracking
        var Module = {
            preRun: [function() {
                console.log("=== MODULE PRE-RUN CALLBACK ===");
            }],
            postRun: [function() {
                console.log("=== MODULE POST-RUN CALLBACK ===");
            }],
            print: (function() {
                console.log("=== MODULE PRINT SETUP ===");
                var element = document.getElementById('output');
                if (element) element.value = '';
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log("[WASM] " + text);
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error("[WASM ERROR] " + text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            // WebGL context attributes for better performance
            webglContextAttributes: {
                alpha: false,              // Disable alpha channel (no transparency) for better performance
                antialias: false,          // Disable antialiasing for pixel-perfect rendering
                depth: true,               // Enable depth buffer
                stencil: false,            // Disable stencil buffer (not needed)
                preserveDrawingBuffer: false,  // Don't preserve buffer between frames
                powerPreference: "high-performance",  // Request high-performance GPU
                premultipliedAlpha: true,  // Standard WebGL setting
                failIfMajorPerformanceCaveat: false  // Allow software rendering if needed
            },
            setStatus: function(text) {
                console.log("=== MODULE STATUS: " + (text || "(empty - loaded)") + " ===");
                var loading = document.getElementById('loading');
                var loadingText = document.getElementById('loading-text');
                var progressFill = document.getElementById('progress-fill');

                if (text) {
                    loadingText.innerHTML = text;

                    // Parse progress from text
                    var match = text.match(/(\d+)%/);
                    if (match) {
                        progressFill.style.width = match[1] + '%';
                    }
                } else {
                    // Game loaded - hide loading screen
                    console.log("=== HIDING LOADING SCREEN ===");
                    loading.classList.add('hidden');
                    setTimeout(() => loading.remove(), 500);
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
            }
        };

        console.log("=== MODULE OBJECT CONFIGURED ===");
        console.log("=== Setting initial status: Downloading... ===");
        Module.setStatus('Downloading...');

        window.onerror = function(event) {
            console.error("=== WINDOW ERROR: " + event + " ===");
            Module.setStatus('Error: See console for details');
        };

        console.log("=== WAITING FOR WASM TO LOAD ===");

        // Fullscreen toggle
        function toggleFullscreen() {
            var elem = document.getElementById('canvas-container');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Reset game
        function resetGame() {
            if (confirm('Reset all progress? This cannot be undone!')) {
                localStorage.clear();
                location.reload();
            }
        }

        // Help dialog
        function showHelp() {
            alert(`Quantum Idle - How to Play

🎯 Goal: Generate qubits by observing superposition states

🖱️ Controls:
• Click on stations to observe and collapse quantum states
• Upgrade stations to increase production
• Unlock new research stations as you progress

⚛️ Quantum Mechanics:
• Superposition: Resources accumulate in uncertain states
• Observation: Collapse the wave function to earn resources
• Entanglement: Link stations for bonus effects

🌟 Prestige: Reset for permanent bonuses when you've earned enough!`);
        }

        // Handle window resize
        function resizeCanvas() {
            var canvas = document.getElementById('canvas');
            var container = document.getElementById('canvas-container');

            // Get container size
            var containerWidth = container.clientWidth;
            var containerHeight = container.clientHeight;

            // Calculate aspect ratio (16:9 for 1280x720)
            var targetAspect = 1280 / 720;
            var containerAspect = containerWidth / containerHeight;

            var newWidth, newHeight;

            if (containerAspect > targetAspect) {
                // Container is wider - fit to height
                newHeight = containerHeight;
                newWidth = containerHeight * targetAspect;
            } else {
                // Container is taller - fit to width
                newWidth = containerWidth;
                newHeight = containerWidth / targetAspect;
            }

            // Set canvas display size
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';

            console.log("Canvas resized to: " + newWidth + "x" + newHeight);
        }

        window.addEventListener('resize', resizeCanvas);

        // Initial resize when page loads
        window.addEventListener('load', function() {
            setTimeout(resizeCanvas, 100);
        });

        // Prevent zoom on mobile
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        // Touch-aware controls
        const touchGrid = document.getElementById('touch-grid');
        const body = document.body;
        const touchStates = {
            tap: 'Tap detected',
            press: 'Long press held',
            swipe: 'Swipe enabled',
            pause: 'Input paused for 3s'
        };

        touchGrid.addEventListener('pointerdown', (event) => {
            const btn = event.target.closest('[data-action]');
            if (!btn) return;
            btn.dataset.active = 'true';
            btn.style.boxShadow = '0 8px 22px rgba(94, 243, 255, 0.35)';

            if (btn.dataset.action === 'pause') {
                body.classList.add('input-paused');
                setTimeout(() => body.classList.remove('input-paused'), 3000);
            }
        });

        touchGrid.addEventListener('pointerup', (event) => {
            const btn = event.target.closest('[data-action]');
            if (!btn) return;
            btn.dataset.active = 'false';
            btn.style.boxShadow = '';
            btn.setAttribute('aria-label', touchStates[btn.dataset.action] || '');
        });

        // Drag-to-scroll helpers
        const dragContainers = document.querySelectorAll('.drag-strip');
        dragContainers.forEach((strip) => {
            let isDown = false;
            let startX = 0;
            let scrollLeft = 0;

            const startDrag = (e) => {
                isDown = true;
                strip.classList.add('dragging');
                startX = e.pageX || e.touches?.[0]?.pageX || 0;
                scrollLeft = strip.scrollLeft;
            };

            const endDrag = () => {
                isDown = false;
                strip.classList.remove('dragging');
            };

            const onMove = (e) => {
                if (!isDown) return;
                const x = e.pageX || e.touches?.[0]?.pageX || 0;
                const walk = (x - startX) * 1.1;
                strip.scrollLeft = scrollLeft - walk;
            };

            strip.addEventListener('mousedown', startDrag);
            strip.addEventListener('touchstart', startDrag, { passive: true });
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);
            window.addEventListener('touchcancel', endDrag);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: true });
        });

        // Tabbed panels
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.tab-panel');
        tabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                tabs.forEach((t) => t.classList.remove('active'));
                panels.forEach((p) => p.classList.remove('active'));
                tab.classList.add('active');
                const panel = document.querySelector(`[data-tab-panel="${tab.dataset.tab}"]`);
                if (panel) panel.classList.add('active');
            });
        });

        // Settings toggles
        const toggles = document.querySelectorAll('.toggle');
        const applySetting = (name, enabled) => {
            switch (name) {
                case 'haptics':
                    document.documentElement.style.setProperty('--touch-shadow', enabled ? '0 8px 22px rgba(94, 243, 255, 0.45)' : '');
                    break;
                case 'contrast':
                    document.documentElement.style.setProperty('--glass-bg', enabled ? 'rgba(0, 0, 0, 0.6)' : 'rgba(0, 0, 0, 0.35)');
                    break;
                case 'motion':
                    document.body.classList.toggle('reduced-motion', enabled);
                    break;
            }
        };

        toggles.forEach((toggle) => {
            toggle.addEventListener('click', () => {
                toggle.classList.toggle('active');
                const enabled = toggle.classList.contains('active');
                const name = toggle.dataset.setting;
                applySetting(name, enabled);
            });
        });

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelector('[data-setting="motion"]').classList.add('active');
            applySetting('motion', true);
        }
    </script>

    <!-- Emscripten script placeholder (required by Emscripten) -->
    {{{ SCRIPT }}}
</body>
</html>
