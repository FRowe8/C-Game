<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Quantum Idle - A quantum mechanics inspired idle game">
    <meta name="theme-color" content="#1a1a2e">
    <title>Quantum Idle - A Quantum Mechanics Idle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        #header {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(94, 243, 255, 0.3);
            flex-shrink: 0;
        }

        #header h1 {
            font-size: clamp(1.2rem, 4vw, 2rem);
            background: linear-gradient(90deg, #5ef3ff, #a855f7, #5ef3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s infinite linear;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #header p {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: #5ef3ff;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Main Game Container */
        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            min-height: 0;
        }

        /* Canvas Container */
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            height: 100%;
            max-height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border: 2px solid rgba(94, 243, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Responsive canvas */
        canvas.emscripten {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Loading Screen */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(94, 243, 255, 0.1);
            border-top-color: #5ef3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            margin-top: 20px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: #5ef3ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #progress-bar {
            width: 80%;
            max-width: 400px;
            height: 6px;
            background: rgba(94, 243, 255, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5ef3ff, #a855f7);
            width: 0%;
            transition: width 0.3s;
            border-radius: 3px;
        }

        /* Footer Controls */
        #controls {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(94, 243, 255, 0.3);
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #5ef3ff, #a855f7);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(94, 243, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            #header {
                padding: 8px 15px;
            }

            #game-container {
                padding: 5px;
            }

            #controls {
                padding: 8px 10px;
                gap: 5px;
            }

            .btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        /* Portrait Mode Warning */
        @media (orientation: portrait) and (max-width: 768px) {
            #canvas-container::before {
                content: "📱 Rotate for better experience";
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 0.8rem;
                z-index: 10;
                animation: fadeIn 0.5s;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Output/Console */
        #output {
            display: none; /* Hide by default */
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>⚛️ Quantum Idle</h1>
        <p>Harness the power of quantum mechanics</p>
    </div>

    <div id="game-container">
        <div id="canvas-container">
            <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

            <div id="loading">
                <div class="loader"></div>
                <div id="loading-text">Initializing Quantum State...</div>
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="controls">
        <button class="btn" onclick="toggleFullscreen()">🖥️ Fullscreen</button>
        <button class="btn" onclick="resetGame()">🔄 New Game</button>
        <button class="btn" onclick="showHelp()">❓ Help</button>
    </div>

    <div id="output"></div>

    <script type='text/javascript'>
        // Progress tracking
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                var element = document.getElementById('output');
                if (element) element.value = '';
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                var loading = document.getElementById('loading');
                var loadingText = document.getElementById('loading-text');
                var progressFill = document.getElementById('progress-fill');

                if (text) {
                    loadingText.innerHTML = text;

                    // Parse progress from text
                    var match = text.match(/(\d+)%/);
                    if (match) {
                        progressFill.style.width = match[1] + '%';
                    }
                } else {
                    // Game loaded - hide loading screen
                    loading.classList.add('hidden');
                    setTimeout(() => loading.remove(), 500);
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
            }
        };

        Module.setStatus('Downloading...');

        window.onerror = function(event) {
            Module.setStatus('Error: See console for details');
        };

        // Fullscreen toggle
        function toggleFullscreen() {
            var elem = document.getElementById('canvas-container');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Reset game
        function resetGame() {
            if (confirm('Reset all progress? This cannot be undone!')) {
                localStorage.clear();
                location.reload();
            }
        }

        // Help dialog
        function showHelp() {
            alert(`Quantum Idle - How to Play

🎯 Goal: Generate qubits by observing superposition states

🖱️ Controls:
• Click on stations to observe and collapse quantum states
• Upgrade stations to increase production
• Unlock new research stations as you progress

⚛️ Quantum Mechanics:
• Superposition: Resources accumulate in uncertain states
• Observation: Collapse the wave function to earn resources
• Entanglement: Link stations for bonus effects

🌟 Prestige: Reset for permanent bonuses when you've earned enough!`);
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            var canvas = document.getElementById('canvas');
            // Emscripten will handle canvas resizing
        });

        // Prevent zoom on mobile
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
    </script>

    <!-- Load the Emscripten compiled game -->
    <script async type="text/javascript" src="QuantumIdle.js"></script>
</body>
</html>
