name: Mobile Platform Readiness

on:
  workflow_dispatch:
    inputs:
      run-android:
        description: "Run Android toolchain configure"
        required: false
        default: "true"
      run-ios:
        description: "Run iOS toolchain configure"
        required: false
        default: "true"

jobs:
  android-config:
    if: ${{ github.event.inputs.run-android != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java & Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk: 26.3.11579264
          cmdline-tools-version: 11076708

      - name: Configure Android build (CMake only)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cmake -S . -B build-android \
            -DPLATFORM_ANDROID=ON \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -G Ninja

      - name: Summarize Android configure artifacts
        run: |
          du -sh build-android || true
          ls build-android || true

  ios-config:
    if: ${{ github.event.inputs.run-ios != 'false' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure iOS build (Xcode generator)
        run: |
          cmake -S . -B build-ios \
            -G Xcode \
            -DPLATFORM_IOS=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Summarize iOS configure artifacts
        run: |
          du -sh build-ios || true
          ls build-ios || true
