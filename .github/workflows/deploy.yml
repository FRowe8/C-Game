name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/cross-platform-game-engine-013AwcfzCsrvQNSqWs4LzZ8h
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Verify Emscripten installation
        run: |
          emcc --version
          which emcc

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake for Emscripten
        run: |
          cd build
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_WEB=ON

      - name: Build web version
        run: |
          cd build
          emmake make -j$(nproc)

      - name: Prepare deployment files
        run: |
          mkdir -p dist
          cp build/QuantumIdle.html dist/index.html
          cp build/QuantumIdle.js dist/
          cp build/QuantumIdle.wasm dist/
          cp build/QuantumIdle.data dist/ || true

          # Copy web assets if they exist
          if [ -d "web/assets" ]; then
            cp -r web/assets dist/
          fi

      - name: Smoke test asset preload bundle
        run: |
          if [ -f "build/QuantumIdle.data" ]; then
            python3 scripts/smoke_test_web_preload.py build/QuantumIdle.data \
              assets/fonts/Roboto-Regular.ttf
          else
            echo "QuantumIdle.data not found, skipping preload verification"
          fi

      - name: Create 404 page (redirect to index)
        run: |
          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <meta http-equiv="refresh" content="0; url=./">
          </head>
          <body>
            <p>Redirecting to game...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
